name: attendance-v0-5-0

services:
  attendance:
    image: attendance-service:v0.5.0
    pull_policy: never
    container_name: attendance-v0-5-0

    ports:
      - "127.0.0.1:8106:8006"

    environment:
      PORT: "${PORT:-8006}"
      MESSAGE: "${MESSAGE:-Attendance offline v0.5.0}"
      DATA_DIR: "${DATA_DIR:-/data}"

    volumes:
      - attendance-data:/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request, sys; port=os.getenv('PORT','8006'); r=urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=2); sys.exit(0 if r.status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  attendance-data:
    name: attendance-data-v0-5-0